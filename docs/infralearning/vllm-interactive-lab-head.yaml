apiVersion: v1
kind: Namespace
metadata:
  name: infra-learning
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ray-vllm-lab-head
  namespace: infra-learning
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ray-vllm-lab-head
  template:
    metadata:
      labels:
        app: ray-vllm-lab-head
    spec:
      schedulerName: default-scheduler
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: server-00
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ray-head
          image: 110.120.0.3:8889/mineru/ray-data:py3.12.13-ray2.48.0-daft0.7.19-s3-wget-20260713
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc", "--"]
          args:
            - |
              exec ray start --head \
                --node-ip-address="${POD_IP}" \
                --port=6379 \
                --dashboard-host=0.0.0.0 \
                --dashboard-port=8265 \
                --ray-client-server-port=10001 \
                --num-cpus=4 \
                --block
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - {name: gcs, containerPort: 6379}
            - {name: dashboard, containerPort: 8265}
            - {name: ray-client, containerPort: 10001}
          resources:
            requests: {cpu: "4", memory: 8Gi}
            limits: {cpu: "4", memory: 8Gi}
          readinessProbe:
            tcpSocket: {port: gcs}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - {name: ray-logs, mountPath: /tmp/ray}
      volumes:
        - name: ray-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ray-vllm-lab-head
  namespace: infra-learning
spec:
  selector:
    app: ray-vllm-lab-head
  ports:
    - {name: gcs, port: 6379, targetPort: gcs}
    - {name: dashboard, port: 8265, targetPort: dashboard}
    - {name: ray-client, port: 10001, targetPort: ray-client}
