apiVersion: scheduling.volcano.sh/v1beta1
kind: PodGroup
metadata:
  name: haidass-npu-image-preflight-pg
  namespace: haidass-eval
spec:
  minMember: 1
  minResources:
    cpu: "4"
    memory: 8Gi
    huawei.com/Ascend910: "1"
---
apiVersion: v1
kind: Pod
metadata:
  name: haidass-npu-image-preflight
  namespace: haidass-eval
  labels:
    app.kubernetes.io/name: haidass-npu-image-preflight
  annotations:
    scheduling.k8s.io/group-name: haidass-npu-image-preflight-pg
    volcano.sh/task-spec: preflight
spec:
  schedulerName: volcano
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: gpu-server-00
    node.kubernetes.io/npu.chip.name: 910B3
  containers:
    - name: preflight
      image: 110.120.0.3:8889/demo:v2
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc", "--"]
      args:
        - |
          set -eo pipefail
          source /root/miniconda3/etc/profile.d/conda.sh
          conda activate ms
          if [ -f /usr/local/Ascend/driver/bin/setenv.bash ]; then
            source /usr/local/Ascend/driver/bin/setenv.bash
          fi
          source /usr/local/Ascend/cann/ascend-toolkit/set_env.sh
          if [ -f /usr/local/Ascend/cann/nnal/atb/set_env.sh ]; then
            source /usr/local/Ascend/cann/nnal/atb/set_env.sh
          fi
          export LD_LIBRARY_PATH="/usr/local/Ascend/driver/lib64/common:/usr/local/Ascend/driver/lib64/driver:${LD_LIBRARY_PATH:-}"

          echo "=== DEVICE MAPPING ==="
          ls -l /dev/davinci* /dev/davinci_manager /dev/devmm_svm /dev/hisi_hdc 2>/dev/null || true
          npu-smi info

          echo "=== DRIVER AND CANN ==="
          cat /usr/local/Ascend/driver/version.info 2>/dev/null || true
          find /usr/local/Ascend -maxdepth 5 -type f -name version.info -print -exec cat {} \; 2>/dev/null || true

          echo "=== PYTHON AND NPU SMOKE ==="
          python - <<'PY'
          import json
          import platform
          import sys

          import ray
          import torch
          import torch_npu

          summary = {
              "architecture": platform.machine(),
              "python": sys.version.split()[0],
              "ray": ray.__version__,
              "torch": torch.__version__,
              "torch_npu": torch_npu.__version__,
              "npu_available": torch.npu.is_available(),
              "npu_count": torch.npu.device_count(),
          }
          if not summary["npu_available"] or summary["npu_count"] != 1:
              raise RuntimeError(f"Expected exactly one visible NPU: {summary}")

          torch.npu.set_device(0)
          left = torch.randn((1024, 1024), dtype=torch.bfloat16, device="npu:0")
          right = torch.randn((1024, 1024), dtype=torch.bfloat16, device="npu:0")
          result = torch.matmul(left, right)
          torch.npu.synchronize()
          summary["device_name"] = torch.npu.get_device_name(0)
          summary["bf16_matmul_shape"] = list(result.shape)
          summary["bf16_matmul_finite"] = bool(torch.isfinite(result.float()).all().cpu())
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          if not summary["bf16_matmul_finite"]:
              raise RuntimeError("BF16 NPU matmul produced non-finite output")
          PY
      resources:
        requests:
          cpu: "4"
          memory: 8Gi
          huawei.com/Ascend910: "1"
        limits:
          cpu: "8"
          memory: 16Gi
          huawei.com/Ascend910: "1"
      volumeMounts:
        - name: ascend-driver
          mountPath: /usr/local/Ascend/driver
          readOnly: true
        - name: ascend-dcmi
          mountPath: /usr/local/dcmi
          readOnly: true
  volumes:
    - name: ascend-driver
      hostPath:
        path: /usr/local/Ascend/driver
        type: Directory
    - name: ascend-dcmi
      hostPath:
        path: /usr/local/dcmi
        type: Directory
